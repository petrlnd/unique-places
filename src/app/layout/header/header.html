<header class="header">
  <div class="container">
    <a routerLink="/">
      <img class="logo" src="/images/logo.png" width="191" height="36" alt="Логотип">
    </a>
    @if (authStore.isAuthenticated()) {
      <nav class="header__menu">
        <a class="header__menu-link" routerLink="/places" routerLinkActive="header__menu-link--active">Места</a>
        <a class="header__menu-link" routerLink="/favorites" routerLinkActive="header__menu-link--active">Избранное</a>
      </nav>
      <div class="header__actions">
        <a class="header__favorites" routerLink="/favorites" aria-label="Избранное">
          <svg class="header__favorites-icon" width="28" height="24.144" viewBox="0 0 28 24.144" aria-hidden="true">
            <path
              d="M14.048 24.142C13.917 24.142 13.786 24.117 13.665 24.066C13.543 24.016 13.433 23.943 13.34 23.85L2.212 12.72C1.509 12.023 0.952 11.194 0.572 10.28C0.193 9.366 -0.002 8.386 0 7.396C0 3.888 2.656 0 7.46 0C9.41 0 11.362 0.714 12.79 2.14L13.994 3.342L15.178 2.152C16.585 0.764 18.486 -0.008 20.462 0.004C26.412 0.004 28 5.368 28 7.504C28 9.418 27.276 11.33 25.828 12.786L14.756 23.852C14.663 23.945 14.553 24.018 14.431 24.068C14.31 24.119 14.179 24.144 14.048 24.144L14.048 24.142ZM7.46 1.928C6.743 1.927 6.032 2.068 5.369 2.342C4.706 2.616 4.103 3.018 3.596 3.526C3.089 4.033 2.687 4.636 2.413 5.299C2.139 5.962 1.999 6.673 2 7.39C2 9.142 2.794 10.472 3.626 11.304L14.048 21.73L24.412 11.372C25.472 10.306 26 8.906 26 7.504C26.002 6.777 25.859 6.057 25.581 5.386C25.303 4.714 24.895 4.104 24.38 3.591C23.866 3.078 23.254 2.672 22.582 2.396C21.909 2.12 21.189 1.98 20.462 1.984C19.054 1.984 17.65 2.51 16.594 3.566L14.706 5.464C14.613 5.557 14.503 5.631 14.382 5.682C14.26 5.732 14.13 5.759 13.998 5.759C13.867 5.759 13.737 5.733 13.615 5.683C13.493 5.633 13.383 5.559 13.29 5.466L11.378 3.556C10.865 3.039 10.255 2.63 9.583 2.35C8.911 2.071 8.19 1.928 7.462 1.93L7.46 1.928Z"
              fill="currentColor"
            />
          </svg>
          @if (favoritesStore.count()) {
            <span class="header__favorites-count">{{ favoritesStore.count() }}</span>
          }
        </a>
        <button class="header__exit" type="button" (click)="authStore.logout()">
          <svg width="32" height="32" viewBox="-4 -4 32 32" aria-hidden="true">
            <path
              d="M4.333 0C3.184 0 2.082 0.457 1.269 1.269C0.457 2.082 0 3.184 0 4.333L0 19.667C0 20.816 0.457 21.918 1.269 22.731C2.082 23.543 3.184 24 4.333 24L16.333 24C16.599 24 16.853 23.895 17.04 23.707C17.228 23.52 17.333 23.265 17.333 23C17.333 22.735 17.228 22.48 17.04 22.293C16.853 22.105 16.599 22 16.333 22L4.333 22C3.714 22 3.121 21.754 2.683 21.317C2.246 20.879 2 20.286 2 19.667L2 4.333C2 3.045 3.045 2 4.333 2L16.333 2C16.599 2 16.853 1.895 17.04 1.707C17.228 1.52 17.333 1.265 17.333 1C17.333 0.735 17.228 0.48 17.04 0.293C16.853 0.105 16.599 0 16.333 0L4.333 0ZM19.373 5.627C19.282 5.528 19.171 5.45 19.049 5.395C18.926 5.34 18.794 5.311 18.659 5.309C18.525 5.306 18.392 5.331 18.267 5.381C18.143 5.431 18.03 5.506 17.935 5.601C17.84 5.696 17.765 5.809 17.715 5.934C17.664 6.058 17.64 6.192 17.642 6.326C17.644 6.46 17.674 6.593 17.728 6.715C17.783 6.838 17.862 6.948 17.96 7.04L21.92 11L7.667 11C7.401 11 7.147 11.105 6.96 11.293C6.772 11.48 6.667 11.735 6.667 12C6.667 12.265 6.772 12.52 6.96 12.707C7.147 12.895 7.401 13 7.667 13L21.92 13L17.96 16.96C17.862 17.052 17.783 17.162 17.728 17.285C17.674 17.407 17.644 17.54 17.642 17.674C17.64 17.808 17.664 17.942 17.715 18.066C17.765 18.191 17.84 18.304 17.935 18.399C18.03 18.494 18.143 18.569 18.267 18.619C18.392 18.669 18.525 18.694 18.659 18.691C18.794 18.689 18.926 18.66 19.049 18.605C19.171 18.55 19.282 18.472 19.373 18.373L25.04 12.707C25.227 12.519 25.332 12.265 25.332 12C25.332 11.735 25.227 11.481 25.04 11.293L19.373 5.627Z"

      </div>

  </div>
</header>
